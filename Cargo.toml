[package]
name = "message-attestation"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
description = "Sign, verify, attach and render author-signed Messages inside a deliverer-signed Delivery carried in an ACP prompt's _meta, with two-phase replay protection"

[dependencies]
identity-crypto = { git = "https://github.com/qtpi-bonding/identity-crypto.git", rev = "feb5d585a77c6ba45eedc16fd08c2bd7feeff782" }
prost = "0.13"
serde_json = "1"
thiserror = "2"

[dev-dependencies]
hex = "0.4"
