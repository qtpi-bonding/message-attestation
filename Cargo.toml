[package]
name = "message-attestation"
version = "0.6.0"
edition = "2021"
rust-version = "1.89"
description = "Sign, verify, attach and render author-signed Messages inside a deliverer-signed Delivery carried in an ACP prompt's _meta, with two-phase replay protection"

[dependencies]
getrandom = "0.4"
coded-error = { git = "https://github.com/qtpi-bonding/coded-error.git", rev = "de21d22e31baff78eae7d4ca817b87430bff1f81", default-features = false }
identity-crypto = { git = "https://github.com/qtpi-bonding/identity-crypto.git", rev = "b4b3da5d857e0311798e843f433d9177ca7f7c7a" }
identity-keyfile = { git = "https://github.com/qtpi-bonding/identity-crypto.git", rev = "b4b3da5d857e0311798e843f433d9177ca7f7c7a" }
prost = "0.13"
rustix = { version = "1", default-features = false, features = ["std", "process"] }
serde_json = "1"
thiserror = "2"
wait-timeout = "0.2"

[dev-dependencies]
hex = "0.4"
rustix = { version = "1", default-features = false, features = ["std", "fs"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[features]
# Lets a crate build a ResolvedPrincipal from a registry record. Only the
# deliverer that owns the registry should enable it.
resolver = []

[[test]]
name = "names"
required-features = ["resolver"]

[workspace]
members = ["message-signer"]
