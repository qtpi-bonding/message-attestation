[package]
name = "message-attestation"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Verify a delivery attestation carried in an ACP prompt's _meta, with two-phase replay protection"

[dependencies]
identity-crypto = { git = "https://github.com/qtpi-bonding/identity-crypto.git", rev = "c52f2b27fed14a0fbac3fbbd9fe5923b9b19ff4a" }
prost = "0.13"
prost-types = "0.13"
base64 = "0.22"
serde_json = "1"
thiserror = "2"
hex = "0.4"
