[package]
name = "message-attestation"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Verify, attach and sign a delivery attestation carried in an ACP prompt's _meta, with two-phase replay protection"

[dependencies]
identity-crypto = { git = "https://github.com/qtpi-bonding/identity-crypto.git", rev = "fb6455b44444cf5e8b9c5879fd7f021f3dd25e2d" }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
hex = "0.4"
